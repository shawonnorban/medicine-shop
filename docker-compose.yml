services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medshop
      POSTGRES_PASSWORD: medshop
      POSTGRES_DB: medshop
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "random_page_cost=1.1"]
  # not used yet; start with: docker compose --profile extras up -d
  redis:
    profiles: [extras]
    image: redis:7-alpine
    ports: ["6379:6379"]
  meilisearch:
    profiles: [extras]
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: ["meili:/meili_data"]
volumes:
  pgdata:
  meili:
